/* Layout: convite do Barça em tela de tablet. Faixa azul e grená no topo, abas grandes,
   mapa aéreo à esquerda e painel de pista à direita (empilha em tela estreita). */
:root{
  --navy:#1B2641; --navy-2:#222F52; --navy-3:#2B3A66;
  --blue:#1D4E9C; --garnet:#A20D3B; --gold:#FBC707;
  --cream:#FEF6D8; --parch:#F6E8B3; --ink:#1B2641; --muted:#C3CCE6; --white:#FFFFFF;
  --f-display:"Erica One","Arial Black",Impact,sans-serif;
  --f-body:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:var(--white);font:400 18px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stripes{height:12px;background:repeating-linear-gradient(90deg,var(--blue) 0 28px,var(--garnet) 28px 56px)}
.stripes.bottom{height:8px;margin-top:28px}
header{padding-block:14px 0}
.kicker{margin:0;text-align:center;font:700 12px/1.3 var(--f-body);letter-spacing:.26em;text-transform:uppercase;color:var(--white)}
h1{margin:6px 0 0;text-align:center;font:400 clamp(30px,5.4vw,56px)/1 var(--f-display);text-transform:uppercase;color:var(--gold);text-shadow:3px 3px 0 var(--garnet);text-wrap:balance}
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0 16px}
.tab{appearance:none;cursor:pointer;min-height:56px;padding:0 24px;border-radius:999px;border:3px solid var(--gold);background:transparent;color:var(--gold);font:400 clamp(16px,2.3vw,22px)/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;display:inline-flex;align-items:center;gap:10px}
.tab[aria-selected="true"]{background:var(--gold);color:var(--navy)}
:focus-visible{outline:4px solid var(--white);outline-offset:3px}
.ic{width:1.15em;height:1.15em;fill:currentColor;flex:none}

/* ---------- mapa ---------- */
.layout{display:grid;gap:18px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"map panel" "rules panel";align-items:start}
.layout>*{min-width:0}
#mapslot{grid-area:map}
.panel{grid-area:panel}
.rules-card{grid-area:rules}
.mapwrap{position:relative;background:var(--parch);padding:10px;border-radius:16px;border:3px solid var(--gold)}
.map{position:relative;aspect-ratio:1459/675;max-width:100%;border-radius:8px;overflow:hidden;background:var(--navy-3)}
.map img{display:block;width:100%;height:100%}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.zoombtn{position:absolute;left:50%;transform:translateX(-50%);top:20px;z-index:2;min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--navy);background:var(--cream);color:var(--navy);font:700 14px/1 var(--f-body);cursor:pointer}
.mlbl{font-family:var(--f-body);font-weight:700;fill:#fff;stroke:#1B2641;stroke-width:9px;paint-order:stroke;stroke-linejoin:round;letter-spacing:.04em}
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.8);opacity:1}50%{transform:scale(1.2);opacity:.55}}

.card{background:var(--cream);color:var(--ink);border:3px solid var(--gold);border-radius:18px;padding:18px 20px}
.card.dark{background:var(--navy-2);color:var(--white)}
.eyebrow{margin:0 0 8px;font:700 13px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--garnet)}
.card.dark .eyebrow{color:var(--gold)}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:16px}
.rules li{display:flex;gap:10px;align-items:flex-start}
.rules .ic{margin-top:3px;color:var(--garnet)}

.panel{display:grid;gap:14px;min-width:0}
h2{margin:0;font:400 clamp(24px,3vw,34px)/1.05 var(--f-display);text-transform:uppercase;color:var(--gold);text-shadow:2px 2px 0 var(--garnet);text-wrap:balance}
.lead{margin:0;color:var(--muted);font-size:17px}
.teams{display:grid;gap:12px}
.team{appearance:none;cursor:pointer;text-align:left;border:3px solid var(--gold);border-radius:18px;padding:16px 20px;color:var(--white);display:grid;gap:4px;min-height:96px}
.team b{font:400 clamp(28px,3.6vw,40px)/1 var(--f-display);letter-spacing:.03em}
.team span{font:400 16px/1.3 var(--f-body)}
.team.grena{background:var(--garnet)}
.team.azul{background:var(--blue)}
.chip{justify-self:start;display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;border:2px solid var(--gold);color:var(--white);font:400 18px/1 var(--f-display);letter-spacing:.07em}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--navy-3);color:var(--muted);border:2px solid transparent;font:700 17px/1 var(--f-body)}
.dot.done{background:var(--gold);color:var(--navy)}
.dot.cur{background:var(--white);color:var(--navy);border-color:var(--gold);box-shadow:0 0 0 3px var(--navy-3)}
.poem{margin:0;font:700 clamp(20px,2vw,26px)/1.35 var(--f-body);color:var(--ink)}
.poem .v{display:block;text-wrap:balance}
.poem .v+.v{margin-top:4px}
.toprow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.btn{appearance:none;cursor:pointer;min-height:56px;padding:0 20px;border-radius:14px;border:3px solid var(--gold);background:transparent;color:var(--gold);font:700 17px/1 var(--f-body);display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.big{min-height:76px;width:100%;font:400 clamp(24px,3vw,32px)/1 var(--f-display);letter-spacing:.04em}
.btn:active{transform:translateY(1px)}
.note{margin:0;padding:12px 16px;border-radius:14px;border:2px dashed var(--gold);color:var(--white);background:var(--navy-2);font-size:17px}
.note b{color:var(--gold);letter-spacing:.12em;margin-right:6px}
.msg{margin:0;min-height:1.4em;font:700 16px/1.4 var(--f-body);color:var(--gold)}
.msg.bad{color:#FF9DB4}
.placechip{display:inline-flex;align-items:center;gap:10px;font:400 24px/1 var(--f-display);color:var(--navy);background:var(--gold);padding:10px 18px;border-radius:999px}
.big-ok{font:400 clamp(30px,4vw,48px)/1.05 var(--f-display);color:var(--gold);text-shadow:3px 3px 0 var(--garnet);margin:0;overflow-wrap:anywhere;text-wrap:balance}

.kp{display:grid;gap:10px}
.kp-display{min-height:68px;border-radius:14px;background:var(--white);color:var(--navy);display:grid;place-items:center;font:700 44px/1 var(--f-body);letter-spacing:.2em;border:3px solid var(--gold)}
.kp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kp-grid button{appearance:none;cursor:pointer;min-height:64px;border-radius:14px;border:3px solid var(--navy);background:var(--white);color:var(--navy);font:700 30px/1 var(--f-body)}
.kp-grid button.ok{background:var(--gold);font-size:22px}
.kp-grid button.del{background:var(--parch);font-size:17px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- cronograma ---------- */
.crono{display:grid;gap:12px;max-width:820px;margin:0 auto}
.slot{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:stretch}
.time{display:grid;place-items:center;align-content:center;gap:5px;padding:6px 2px;text-align:center;border-radius:16px;background:var(--navy-2);border:3px solid var(--gold);color:var(--gold);font:700 26px/1 var(--f-body);font-variant-numeric:tabular-nums}
.time small{font:400 12px/1.1 var(--f-body);letter-spacing:.03em;opacity:.9}
.slot .card{display:flex;gap:14px;align-items:flex-start}
.slot .card .ic{width:34px;height:34px;color:var(--garnet);margin-top:2px}
.slot h3{margin:0;font:400 22px/1.15 var(--f-display);text-transform:uppercase;color:var(--navy);letter-spacing:.02em}
.slot p{margin:6px 0 0;font-size:16px}
.slot.agora .card{background:var(--gold);border-color:var(--white)}
.slot.agora .time{background:var(--garnet);color:var(--white)}
.slot.destaque .card{border-color:var(--garnet);border-width:4px}
.tag{display:inline-block;margin-left:8px;padding:4px 10px;border-radius:999px;background:var(--garnet);color:var(--white);font:700 12px/1 var(--f-body);letter-spacing:.14em;vertical-align:middle}
.slot .btn{margin-top:10px;min-height:48px;color:var(--navy);border-color:var(--navy);font-size:15px}
.foot{margin:22px 0 0;text-align:center;color:var(--muted);font-size:14px}
.foot button{appearance:none;background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;padding:12px 8px;min-height:44px}
.slot .card>div{min-width:0}
.slot h3,.slot p{overflow-wrap:anywhere}
.slot.par .card{border-style:dashed}
.slot .row{margin-top:10px}
.slot .row .btn{margin-top:0;min-height:44px}
.btn.warn,.slot .btn.warn{background:var(--garnet);color:#fff;border-color:var(--garnet)}

/* editor do cronograma */
.fld{display:grid;gap:6px}
.fld>label{font:700 13px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.fld input,.fld textarea,.linkbox{width:100%;font:400 18px/1.3 var(--f-body);padding:12px 14px;border-radius:12px;border:3px solid var(--gold);background:var(--white);color:var(--navy);min-height:52px;color-scheme:light}
.fld textarea,.linkbox{resize:none}
.linkbox{font-size:14px;min-height:0;word-break:break-all}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>*{min-width:0}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--navy-3);font-size:16px;cursor:pointer}
.chk input{width:26px;height:26px;flex:none;margin:0;accent-color:var(--gold)}
.icbtn{appearance:none;cursor:pointer;width:56px;height:56px;border-radius:14px;border:3px solid var(--navy-3);background:var(--navy-2);color:var(--white);display:grid;place-items:center;padding:0}
.icbtn .ic{width:30px;height:30px}
.icbtn[aria-pressed="true"]{background:var(--gold);color:var(--navy);border-color:var(--white)}

/* ---------- janelas ---------- */
.modal{position:fixed;inset:0;z-index:40;background:#0E1630;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.modal-in{max-width:760px;margin:0 auto;display:grid;gap:14px}
.modal .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.zoomscroll{overflow:auto;border-radius:12px;border:3px solid var(--gold)}
.zoomscroll .map{width:max(100%,1100px);max-width:none;border-radius:0}
.adult-list{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:15px}
.adult-list li{padding:10px 12px;border-radius:12px;background:var(--navy-2);border:1px solid var(--navy-3)}
.adult-list b{color:var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(720deg)}}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"map" "panel" "rules"}
}
@media (max-width:420px){
  .two{grid-template-columns:1fr}
}
@media (max-width:520px){
  .slot{grid-template-columns:76px minmax(0,1fr);gap:10px}
  .time{font-size:20px}
  .slot h3{font-size:19px}
  .btn{padding:0 14px}
}
@media (prefers-reduced-motion:reduce){
  .ring,.shake,.confetti i{animation:none}
}

      if (E.msg) h += '<p class="msg" style="margin-top:8px">' + esc(E.msg) + '</p>';
      if (E.warn) h += '<p class="msg bad" style="margin-top:8px">' + esc(E.warn) + '</p>';
      h += '</div>';
    }
    if (!list.length) h += '<p class="note">' + (E.edit ? "Nenhum horário ainda. Toque em Adicionar horário." : "O cronograma ainda não foi preenchido.") + '</p>';
    list.forEach(function (it) {
      var del = E.conf === "del:" + it.id;
      h += '<div class="slot' + (ag.main === it.id ? " agora" : "") + (it.destaque ? " destaque" : "") + (it.par ? " par" : "") + '"><div class="time"><span>' + it.ini + '</span>' + (it.fim ? '<small>até ' + it.fim + '</small>' : '') + '</div><div class="card">' + ic(it.i) + '<div><h3>' + esc(it.t) + (ag.on[it.id] ? '<span class="tag">AGORA</span>' : '') + '</h3>' + (it.d ? '<p>' + esc(it.d) + '</p>' : '') +
        (it.mapa ? '<button class="btn" data-act="tab" data-v="mapa">Abrir o mapa do tesouro</button>' : '') +
        (E.edit ? '<div class="row"><button class="btn sm" data-act="eedit" data-v="' + it.id + '">Editar</button><button class="btn sm' + (del ? " warn" : "") + '" data-act="edel" data-v="' + it.id + '">' + (del ? "Confirmar exclusão" : "Excluir") + '</button></div>' : '') +
        '</div></div></div>';
    });
    $("crono").innerHTML = h;
    renderQuando();
  }

  /* ---- editor (modo adulto) ---- */
  function editorHTML(f, edit) {
    var icons = ICONS.map(function (n) { return '<button type="button" class="icbtn" data-act="eicon" data-v="' + n + '" aria-label="' + ICON_PT[n] + '" aria-pressed="' + (n === f.i) + '">' + ic(n) + '</button>'; }).join("");
    return '<div class="modal-in"><div class="top"><h2 style="font-size:28px">' + (edit ? "Alterar horário" : "Novo horário") + '</h2><button class="btn" data-act="ecancel">Cancelar</button></div>' +
      '<div class="card dark" style="display:grid;gap:16px">' +
      '<div class="fld"><label for="f-t">Título</label><input id="f-t" type="text" maxlength="60" autocomplete="off" value="' + esc(f.t) + '"></div>' +
      '<div class="fld"><label for="f-d">Descrição (opcional)</label><textarea id="f-d" rows="2" maxlength="160">' + esc(f.d) + '</textarea></div>' +
      '<div class="two"><div class="fld"><label for="f-i">Início</label><input id="f-i" type="time" value="' + f.ini + '"></div>' +
      '<div class="fld"><label for="f-f">Término (opcional)</label><input id="f-f" type="time" value="' + f.fim + '"></div></div>' +
      '<div class="fld"><label id="f-il">Ícone</label><div class="row" id="f-icons" role="group" aria-labelledby="f-il">' + icons + '</div></div>' +
      '<label class="chk"><input type="checkbox" id="f-par"' + (f.par ? " checked" : "") + '><span>Acontece junto com outra atividade (ex.: sorvete liberado)</span></label>' +
      '<label class="chk"><input type="checkbox" id="f-dest"' + (f.destaque ? " checked" : "") + '><span>Destacar com borda grená</span></label>' +
      '<label class="chk"><input type="checkbox" id="f-mapa"' + (f.mapa ? " checked" : "") + '><span>Mostrar o botão “Abrir o mapa do tesouro”</span></label>' +
      '<p class="msg bad" id="emsg" aria-live="polite"></p>' +
      '<button class="btn gold big" data-act="esave">SALVAR</button></div></div>';
  }
  function openEditor(id) {
    var it = id ? CRONO.filter(function (x) { return x.id === id; })[0] : null;
    E.form = { id: it ? it.id : null, i: it ? it.i : "star" };
    $("editor").innerHTML = editorHTML(it || { ini: "", fim: "", t: "", d: "", i: "star", par: false, destaque: false, mapa: false }, !!it);
    $("editor").hidden = false;
  }
  function saveEditor() {
    var t = $("f-t").value.trim(), d = $("f-d").value.trim(), a = $("f-i").value, b = $("f-f").value, m = $("emsg");
    if (!t) { m.textContent = "Escreva um título."; return; }
    if (!HORA.test(a)) { m.textContent = "Escolha o horário de início."; return; }
    if (b && !HORA.test(b)) { m.textContent = "Horário de término inválido."; return; }
    if (b && toMin(b) <= toMin(a)) { m.textContent = "O término precisa ser depois do início."; return; }
    var it = { id: E.form.id || newId(), ini: a, fim: b || "", t: t, d: d, i: E.form.i, par: $("f-par").checked, destaque: $("f-dest").checked, mapa: $("f-mapa").checked };
    if (E.form.id) CRONO = CRONO.map(function (x) { return x.id === it.id ? it : x; }); else CRONO.push(it);
    persistCrono(); E.form = null; E.msg = "Salvo."; E.link = ""; $("editor").hidden = true; renderCrono();
  }
  function b64url(str) {
    var bytes = new TextEncoder().encode(str), s = "";
    for (var k = 0; k < bytes.length; k++) s += String.fromCharCode(bytes[k]);
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function shareLink() {
    var url = location.href.split("#")[0] + "#c=" + b64url(JSON.stringify(CRONO));
    E.link = url; E.msg = "Copie o link abaixo e abra nos outros aparelhos."; renderCrono();
    try { navigator.clipboard.writeText(url).then(function () { E.msg = "Link copiado! Cole numa mensagem e abra nos outros aparelhos."; renderCrono(); }, function () { }); } catch (e) { }
  }
  function importHash() {
    var m = /^#c=([A-Za-z0-9_-]+)$/.exec(location.hash || ""); if (!m) return false;
    try {
      var b = m[1].replace(/-/g, "+").replace(/_/g, "/"); while (b.length % 4) b += "=";
      var bin = atob(b), bytes = new Uint8Array(bin.length);
      for (var k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
      var l = cleanList(JSON.parse(new TextDecoder().decode(bytes)));
      if (!l) return false;
      CRONO = l; persistCrono(); E.note = "Cronograma atualizado a partir do link."; return true;
    } catch (e) { return false; }
  }

  /* ---------------- ações ---------------- */
  function confetti() {
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var box = document.createElement("div"); box.className = "confetti";
    var cols = [GOLD, GARNET, BLUE, "#fff"];
    for (var i = 0; i < 70; i++) {
      var p = document.createElement("i");
      p.style.left = Math.random() * 100 + "%";
      p.style.background = cols[i % 4];
      p.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      p.style.animationDelay = (Math.random() * .5) + "s";
      p.style.animationDuration = (2 + Math.random() * 1.4) + "s";
      box.appendChild(p);
    }
    $("fx").appendChild(box);
    setTimeout(function () { box.remove(); }, 4200);
  }
  function setTab(v) {
    var m = v !== "crono";
    $("sec-mapa").hidden = !m; $("sec-crono").hidden = m;
    $("tab-mapa").setAttribute("aria-selected", m); $("tab-crono").setAttribute("aria-selected", !m);
    try { history.replaceState(null, "", m ? "#mapa" : "#cronograma"); } catch (e) { }
    if (!m) renderCrono();
  }
  function speak() {
    try {
      var sy = window.speechSynthesis; if (!sy) return;
      if (sy.speaking) { sy.cancel(); return; }
      var u = new SpeechSynthesisUtterance(curPlace().pista.join(". ")); u.lang = "pt-BR"; u.rate = .9; sy.speak(u);
    } catch (e) { }
  }
  function kd(v) { K.val = (K.val + v).slice(0, 4); K.msg = ""; refreshKp(); }
  function refreshKp() { var d = document.querySelector("#" + (K.mode === "pin" ? "adult" : "panel") + " .kp-display"); if (d) d.textContent = K.val || " "; var m = $("msg"); if (m) { m.textContent = K.msg; m.className = "msg" + (K.bad ? " bad" : ""); } }
  function bad(msg) {
    K.val = ""; K.msg = msg; K.bad = true; refreshKp();
    var kp = document.querySelector("#" + (K.mode === "pin" ? "adult" : "panel") + " .kp"); if (kp) { kp.classList.remove("shake"); void kp.offsetWidth; kp.classList.add("shake"); }
  }
  function kok() {
    if (K.mode === "pin") {
      if (K.val === PIN_ADULTO) { A.ok = true; K.mode = null; K.val = ""; K.msg = ""; renderAdult(); } else bad("Código incorreto.");
      return;
    }
    if (K.mode === "gpin") {
      if (K.val === PIN_GRUPO || K.val === PIN_ADULTO) {
        var t = K.pend; K.mode = null; K.pend = null; K.val = ""; K.msg = ""; K.bad = false;
        S.team = t; S.step = 0; S.arrived = false; S.hint = 0; save(); render();
      } else bad("Código incorreto. Peçam o código ao adulto.");
      return;
    }
    var pl = curPlace();
    if (K.val === pl.codigo) {
      K.mode = null; K.val = ""; K.msg = ""; K.bad = false; confetti();
      if (isFinalStep()) { S.step++; } else { S.arrived = true; }
      S.hint = 0; save(); render();
    } else bad("Esse número não é o do papel. Procurem de novo!");
  }
  function go(a, v) {
    if (a !== "edel" && a !== "epadrao") E.conf = null;
    switch (a) {
      case "tab": setTab(v); break;
      case "team": K.mode = "gpin"; K.pend = v; K.val = ""; K.msg = ""; K.bad = false; render(); break;
      case "gback": K.mode = null; K.pend = null; K.val = ""; K.msg = ""; K.bad = false; render(); break;
      case "crono-edit":
        A.open = false; A.ok = false; K.mode = null; K.val = ""; $("adult").hidden = true;
        E.edit = true; E.msg = ""; E.link = ""; E.note = ""; setTab("crono"); render(); break;
      case "eadd": openEditor(null); break;
      case "eedit": openEditor(v); break;
      case "eicon":
        E.form.i = v;
        Array.prototype.forEach.call(document.querySelectorAll("#f-icons .icbtn"), function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-v") === v)); });
        break;
      case "esave": saveEditor(); break;
      case "ecancel": E.form = null; $("editor").hidden = true; break;
      case "edel":
        if (E.conf === "del:" + v) { CRONO = CRONO.filter(function (x) { return x.id !== v; }); persistCrono(); E.conf = null; E.msg = "Horário excluído."; E.link = ""; }
        else E.conf = "del:" + v;
        renderCrono(); break;
      case "epadrao":
        if (E.conf === "padrao") { CRONO = cleanList(CRONO_PADRAO); persistCrono(); E.conf = null; E.msg = "Cronograma padrão restaurado."; E.link = ""; }
        else E.conf = "padrao";
        renderCrono(); break;
      case "eshare": shareLink(); break;
      case "selbox": var bx = $("linkbox"); if (bx) bx.select(); break;
      case "edone": E.edit = false; E.link = ""; E.msg = ""; E.warn = ""; E.conf = null; renderCrono(); break;
      case "speak": speak(); break;
      case "hint": S.hint = Math.max(S.hint, 1); save(); render(); break;
      case "maphint": S.hint = 2; save(); render(); break;
      case "chegamos": K.mode = "code"; K.val = ""; K.msg = ""; K.bad = false; render(); break;
      case "arrive": S.arrived = true; S.hint = 0; confetti(); save(); render(); break;
      case "achou": S.step++; S.hint = 0; confetti(); save(); render(); break;
      case "next": S.step++; S.arrived = false; S.hint = 0; K.mode = null; save(); render(); break;
      case "kd": kd(v); break;
      case "kdel": K.val = K.val.slice(0, -1); K.msg = ""; refreshKp(); break;
      case "kok": kok(); break;
      case "zoom": $("zoom").hidden = false; $("zoom").innerHTML = zoomHTML(); break;
      case "zoomclose": $("zoom").hidden = true; break;
      case "adult": A.open = true; A.ok = false; A.confirm = false; K.mode = "pin"; K.val = ""; K.msg = ""; K.bad = false; $("adult").hidden = false; render(); break;
      case "adultclose": A.open = false; A.ok = false; K.mode = null; K.val = ""; $("adult").hidden = true; render(); break;
      case "setteam": S.team = v; S.step = 0; S.arrived = false; S.hint = 0; save(); render(); break;
      case "noop": break;
      case "goto": S.step = +v; S.arrived = false; S.hint = 0; K.mode = null; save(); render(); break;
      case "reveal": S.reveal = !S.reveal; save(); render(); break;
      case "reset":
        if (!A.confirm) { A.confirm = true; renderAdult(); } else { S = { v: 1, team: null, step: 0, arrived: false, hint: 0, reveal: false }; A.confirm = false; K.mode = null; save(); render(); }
        break;
    }
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    go(b.getAttribute("data-act"), b.getAttribute("data-v"));
  });

  render();
  var veioDeLink = importHash();
  renderQuando();
  setTab(veioDeLink || location.hash === "#cronograma" ? "crono" : "mapa");
  setInterval(function () { if (!$("sec-crono").hidden && !E.edit) renderCrono(); }, 30000);
})();
</script>

</body>
